[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rpt-agent"
version = "0.1.0"
description = "Local-first patient outreach and Stride booking service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain>=1,<2",
  "langchain-openai>=1,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "tzdata>=2024.1",  # Stride returns legacy zone names (US/Eastern); slim images omit them
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
rpt = "rpt_agent.cli:main"
rpt-worker = "rpt_agent.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rpt_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires TEST_DATABASE_URL"]

[tool.ruff]
line-length = 100
target-version = "py311"

